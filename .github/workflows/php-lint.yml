name: PHP lint
on:
  push:
    branches: [main]
    paths:
      - 'api.php'
      - 'php/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'api.php'
      - 'php/**/*.php'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint PHP
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
